<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoWorkSpace – Log in or sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14192b; --paper:#f6f7fb; --card:#fff; --navy:#1f2a44;
  --brand:#c8102e; --brand-dark:#9d0c24; --gold:#c9a96a;
  --line:#e3e6ef; --muted:#6b7285; --soft:#aab2c8; --ok:#137a45; --err:#b3261e;
  --display:"Playfair Display",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.5}
.shell{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}

/* Left: floor plan */
.plan{background:linear-gradient(160deg,rgba(31,42,68,.94),rgba(31,42,68,.80)),var(--plan-img,none) center/cover,var(--navy);color:#fff;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.brand{font-family:var(--body);font-weight:800;font-size:1.4rem;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand)}
.plan h1{font-family:var(--display);font-size:clamp(2rem,3.6vw,3.2rem);line-height:1.1;margin:0 0 12px;max-width:14ch}
.plan p{margin:0;color:var(--soft);max-width:36ch}
.floor{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid rgba(255,255,255,.25);background:transparent;color:var(--soft);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;font-size:.8rem;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--gold);color:#fff}
.chip.active{background:#fff;border-color:#fff;color:var(--navy)}
.more{align-self:center;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:8px 20px;font:inherit;font-weight:600;font-size:.82rem;cursor:pointer;transition:.2s}
.more:hover{border-color:var(--gold)}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rcard{background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.3s}
.rcard:hover{transform:translateY(-4px)}
.rimg{height:92px;position:relative;background-size:cover;background-position:center}
.rtag{position:absolute;top:8px;left:8px;background:#fff;border-radius:999px;padding:3px 10px;font-size:.68rem;font-weight:700}
.rprice{position:absolute;right:8px;bottom:8px;background:var(--brand);color:#fff;border-radius:10px;padding:3px 10px;font-weight:700;font-size:.78rem}
.rbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.rbody h3{margin:0;font-family:var(--body);font-size:.95rem;line-height:1.25}
.rmeta{display:flex;gap:12px;color:var(--muted);font-size:.76rem}
.ramen{display:flex;gap:5px;flex-wrap:wrap}
.ramen span{background:#f0f2f9;border-radius:6px;padding:2px 7px;font-size:.68rem;font-weight:600;color:var(--navy)}

/* Right: auth */
.auth{display:grid;place-items:center;padding:32px 20px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:10px;padding:4px;margin-bottom:24px}
.tab{border:0;background:transparent;font:inherit;font-weight:700;padding:10px;border-radius:7px;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,38,58,.15)}
h2{font-family:var(--display);font-size:1.6rem;margin:0 0 4px}
.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
label{display:block;font-weight:500;font-size:.9rem;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid rgba(200,16,46,.35);outline-offset:1px;border-color:var(--brand)}
.hint{font-size:.82rem;color:var(--ok);margin:6px 0 0;min-height:1.1em}
.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:999px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(200,16,46,.3);transition:.25s}
.btn:hover{background:var(--brand-dark);transform:translateY(-2px)}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.9rem;color:var(--err)}
.msg.ok{color:var(--ok)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:20px 0 16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#gbtn{display:flex;justify-content:center}
.gfallback{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.gfallback:hover{background:var(--paper)}
[hidden]{display:none!important}

/* Welcome */
.wimg{height:130px;margin:-32px -32px 22px;border-radius:14px 14px 0 0;background-size:cover;background-position:center}
.welcome h2{font-size:1.8rem}
.welcome .btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.welcome .btn.alt:hover{background:var(--paper)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .plan{padding:28px 24px;gap:20px}
  .plan h1{max-width:none}
  .rimg{height:64px}
  .ramen{display:none}
}
</style>
</head>

<div class="shell">

  <aside class="plan">
    <div class="brand">CoWorkSpace</div>
    <div>
      <h1>Find a room. Book it in seconds.</h1>
      <p>Focus rooms, call booths and boardrooms, all in one place.</p>
    </div>
    <div class="floor">
      <div class="chips" id="chips" role="group" aria-label="Filter rooms by type"></div>
      <div class="rooms" id="rooms"></div>
      <button type="button" class="more" id="more"></button>
    </div>
  </aside>

  <main class="auth">
    <!-- Auth card -->
    <section class="card" id="authView">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabLogin" aria-selected="true" aria-controls="loginForm">Log in</button>
        <button class="tab" role="tab" id="tabSignup" aria-selected="false" aria-controls="signupForm">Sign up</button>
      </div>

      <form id="loginForm" novalidate>
        <h2>Welcome back</h2>
        <p class="sub">Log in to see and book available rooms.</p>
        <label for="liEmail">Email</label>
        <input id="liEmail" type="email" autocomplete="email" placeholder="you@gmail.com" required>
        <label for="liPass">Password</label>
        <input id="liPass" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Log in</button>
        <p class="msg" id="liMsg" role="alert"></p>
      </form>

      <form id="signupForm" novalidate hidden>
        <h2>Create your account</h2>
        <p class="sub">Sign up with your Gmail or any other email.</p>
        <label for="suName">Full name</label>
        <input id="suName" type="text" autocomplete="name" required>
        <label for="suEmail">Email</label>
        <input id="suEmail" type="email" autocomplete="email" placeholder="you@gmail.com" required>
        <p class="hint" id="suHint"></p>
        <label for="suPass">Password</label>
        <input id="suPass" type="password" autocomplete="new-password" minlength="8" required>
        <label for="suPass2">Confirm password</label>
        <input id="suPass2" type="password" autocomplete="new-password" required>
        <button class="btn" type="submit">Create account</button>
        <p class="msg" id="suMsg" role="alert"></p>
      </form>

      <div class="or">or</div>
      <div id="gbtn"></div>
      <p class="msg" id="gMsg" role="alert"></p>
    </section>

    <!-- Welcome -->
    <section class="card welcome" id="welcomeView" hidden>
      <div class="wimg" id="wimg"></div>
      <h2 id="hello">Hi!</h2>
      <p class="sub" id="who"></p>
      <button class="btn" id="goBook" type="button">Browse rooms</button>
      <button class="btn alt" id="logout" type="button">Log out</button>
      <p class="msg ok" id="wMsg"></p>
    </section>
  </main>
</div>

<script>
/* ---------- Setup ----------
   To enable real "Continue with Google" (Gmail) sign-in:
   1. Go to https://console.cloud.google.com/apis/credentials
   2. Create an OAuth client ID (type: Web application)
   3. Add your site's address under "Authorized JavaScript origins"
   4. Paste the client ID below.
*/
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

// Demo storage: users live in this browser only. A real site needs a backend.
const db = {
  read(k, fallback){ try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
  write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  remove(k){ try { localStorage.removeItem(k); } catch {} }
};

function normalizeEmail(e){
  e = e.trim().toLowerCase();
  // Gmail ignores dots and +tags in the name part, so treat them as the same account
  const [name, domain] = e.split("@");
  if (domain === "gmail.com" || domain === "googlemail.com"){
    return name.split("+")[0].replace(/\./g, "") + "@gmail.com";
  }
  return e;
}

async function hashPassword(pw, salt){
  if (window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + pw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  return btoa(salt + pw); // fallback for very old browsers (demo only)
}

/* ---------- Views ---------- */
function showAuth(){ $("#authView").hidden = false; $("#welcomeView").hidden = true; }
function showWelcome(user){
  $("#authView").hidden = true;
  $("#welcomeView").hidden = false;
  $("#hello").textContent = "Hi, " + user.name.split(" ")[0] + "!";
  $("#who").textContent = "You’re signed in as " + user.email + ".";
  $("#wMsg").textContent = "";
}

function setTab(which){
  const login = which === "login";
  $("#tabLogin").setAttribute("aria-selected", login);
  $("#tabSignup").setAttribute("aria-selected", !login);
  $("#loginForm").hidden = !login;
  $("#signupForm").hidden = login;
  ["#liMsg", "#suMsg", "#gMsg"].forEach(s => $(s).textContent = "");
}
$("#tabLogin").onclick = () => setTab("login");
$("#tabSignup").onclick = () => setTab("signup");

/* ---------- Gmail hint ---------- */
$("#suEmail").addEventListener("input", e => {
  const v = e.target.value.trim().toLowerCase();
  $("#suHint").textContent = /@(gmail|googlemail)\.com$/.test(v) ? "Gmail account detected." : "";
});

/* ---------- Sign up ---------- */
$("#signupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#suMsg"); msg.className = "msg";
  const name = $("#suName").value.trim();
  const rawEmail = $("#suEmail").value.trim();
  const pass = $("#suPass").value, pass2 = $("#suPass2").value;

  if (!name) return msg.textContent = "Enter your full name.";
  if (!EMAIL_RE.test(rawEmail)) return msg.textContent = "Enter a valid email address, like you@gmail.com.";
  if (pass.length < 8) return msg.textContent = "Use a password with at least 8 characters.";
  if (pass !== pass2) return msg.textContent = "The passwords don’t match.";

  const email = normalizeEmail(rawEmail);
  const users = db.read("cws_users", {});
  if (users[email]) return msg.textContent = "An account with this email exists. Log in instead.";

  const salt = crypto.getRandomValues ? [...crypto.getRandomValues(new Uint8Array(8))].join("") : String(Date.now());
  users[email] = { name, email, salt, hash: await hashPassword(pass, salt), provider: "password" };
  db.write("cws_users", users);
  db.write("cws_session", email);

  showWelcome(users[email]);
  e.target.reset();
});

/* ---------- Log in ---------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#liMsg"); msg.className = "msg";
  const rawEmail = $("#liEmail").value.trim(), pass = $("#liPass").value;
  if (!EMAIL_RE.test(rawEmail) || !pass) return msg.textContent = "Enter your email and password.";

  const email = normalizeEmail(rawEmail);
  const user = db.read("cws_users", {})[email];
  if (!user) return msg.textContent = "No account found. Sign up to get started.";
  if (user.provider === "google" && !user.hash) return msg.textContent = "This account uses Google. Choose Continue with Google.";
  if (await hashPassword(pass, user.salt) !== user.hash) return msg.textContent = "Wrong password. Try again.";

  db.write("cws_session", email);
  showWelcome(user);
  e.target.reset();
});

/* ---------- Google (Gmail) sign-in ---------- */
function decodeJwt(token){
  const b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  const json = decodeURIComponent(atob(b64).split("").map(c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join(""));
  return JSON.parse(json);
}

function onGoogleCredential(resp){
  try {
    const p = decodeJwt(resp.credential);
    if (!p.email_verified) return $("#gMsg").textContent = "Your Google email isn’t verified.";
    const email = normalizeEmail(p.email);
    const users = db.read("cws_users", {});
    // Creates the account on first use, logs in on every use after that
    users[email] = users[email] || { name: p.name || email.split("@")[0], email, provider: "google" };
    db.write("cws_users", users);
    db.write("cws_session", email);
    showWelcome(users[email]);
  } catch {
    $("#gMsg").textContent = "Google sign-in failed. Try again.";
  }
}

function setupGoogle(){
  const host = $("#gbtn");
  const configured = !GOOGLE_CLIENT_ID.startsWith("YOUR_");
  if (configured){
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
      google.accounts.id.renderButton(host, { theme: "outline", size: "large", text: "continue_with", width: 356 });
    };
    s.onerror = () => $("#gMsg").textContent = "Couldn’t load Google sign-in. Check your connection.";
    document.head.appendChild(s);
  } else {
    host.innerHTML = '<button type="button" class="gfallback">' +
      '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>' +
      'Continue with Google</button>';
    host.firstChild.onclick = () => {
      $("#gMsg").textContent = "Add your Google client ID in the script to turn this on.";
    };
  }
}

/* ---------- Welcome actions ---------- */
$("#logout").onclick = () => {
  db.remove("cws_session");
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  setTab("login");
  showAuth();
};

let roomFilter = "All", showAll = false;

function renderRooms(){
  const types = ["All", "Boardroom", "Training", "Huddle"];
  $("#chips").innerHTML = types.map(t =>
    '<button type="button" class="chip' + (t === roomFilter ? " active" : "") + '" data-type="' + t + '">' + t + "</button>").join("");
  const list = ROOMS.filter(r => roomFilter === "All" || r.type === roomFilter);
  const shown = showAll ? list : list.slice(0, 4);
  const more = $("#more");
  more.hidden = list.length <= 4;
  more.textContent = showAll ? "Show fewer rooms" : "Show all " + list.length + " rooms";
  $("#rooms").innerHTML = shown.map(r =>
    '<article class="rcard">' +
      '<div class="rimg" style="background-image:url(\'' + r.img + '\'), ' + r.grad + '">' +
        '<span class="rtag">' + r.type + "</span>" +
        '<span class="rprice">₱' + r.price.toLocaleString() + "/hr</span>" +
      "</div>" +
      '<div class="rbody"><h3>' + r.name + "</h3>" +
        '<div class="rmeta"><span>👥 ' + r.seats + " seats</span><span>📐 " + r.size + "</span></div>" +
        '<div class="ramen">' + r.amen.map(a => "<span>" + a + "</span>").join("") + "</div>" +
      "</div></article>").join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b){ roomFilter = b.dataset.type; showAll = false; renderRooms(); }
});
$("#more").addEventListener("click", () => { showAll = !showAll; renderRooms(); });
